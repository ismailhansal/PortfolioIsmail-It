<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Title -->
    <title>Ismail Hansal - Portfolio Web Developer & Freelance Projects</title>
    
    <!-- Meta description (SEO) -->
    <meta name="description" content="Portfolio of Ismail Hansal, web developer and freelance projects showcasing React, Laravel, Tailwind CSS, and more. View live projects and GitHub repositories." />
    
    <!-- Meta keywords (optionnel, mais peut aider) -->
    <meta name="keywords" content="Ismail Hansal, portfolio, web developer, freelance, React, Laravel, Tailwind CSS, web projects, GitHub projects" />
    
    <!-- Author -->
    <meta name="author" content="Ismail Hansal" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.yourportfolio.com/" />

    <!-- Open Graph (Facebook & general social sharing) -->
    <meta property="og:title" content="Ismail Hansal - Portfolio Web Developer & Freelance Projects" />
    <meta property="og:description" content="Portfolio of Ismail Hansal, showcasing web development skills and freelance projects with React, Laravel, Tailwind CSS, and more." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.yourportfolio.com/" />
    <meta property="og:image" content="https://www.yourportfolio.com/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ismail Hansal - Portfolio Web Developer & Freelance Projects" />
    <meta name="twitter:description" content="Portfolio of Ismail Hansal, showcasing web development skills and freelance projects with React, Laravel, Tailwind CSS, and more." />
    <meta name="twitter:image" content="https://www.yourportfolio.com/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
